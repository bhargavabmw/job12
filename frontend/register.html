<html lang="en">
  <head><meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><title>Create account | CareerBridge</title><link rel="stylesheet" href="css/style.css" /></head>

    <header><a class="brand" href="index.html"><span class="brand-mark">CB</span>CareerBridge</a><nav id="nav"></nav></header>
    <main class="auth-main"><section class="auth-intro"><span class="eyebrow">JOIN THE NETWORK</span><h1>Build what comes next.</h1><p>Whether you are finding your people or your next opportunity, start here.</p></section><section class="panel auth"><h2>Create your account</h2><p class="muted">It only takes a minute to get started.</p><form id="form"><label>Name<input name="name" placeholder="Your full name" required minlength="2" /></label><label>Email<input name="email" type="email" placeholder="you@example.com" required /></label><label>Password<input name="password" type="password" placeholder="At least 6 characters" minlength="6" required /></label><label>I am here to<select name="role"><option value="candidate">Find my next role</option><option value="recruiter">Build my team</option></select></label><p><button>Create account <span>→</span></button></p></form><p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p></section></main>
    <script src="js/config.js"></script><script src="js/utils.js"></script><script src="js/api.js"></script><script src="js/auth.js"></script><script>bindRegister(document.querySelector('#form'));</script>
